DATA:
  SAMPLER_MODE: unsupervised_det
  MAX_SAMPLE_INTERVAL: 200
  UNSUPERVISED_SCALE_JITTER: 2
  MIN_FLOW_SCORE: 0.4
  SEARCH:
    SIZE: 256
  TEMPLATE:
    SIZE: 256
  TRAIN:
    DATASETS_NAME:
    - LASOT_flow
    - GOT10K_flow
    - YTVOS_flow
    - VID_flow
    DATASETS_RATIO:
    - 2
    - 2
    - 1
    - 2
    SAMPLE_PER_EPOCH: 60000
MODEL:
  ENCODER:
    TYPE: vit_base_patch16
    PRETRAIN_TYPE: mae
  HEAD:
    TYPE: FCOS
  DECODER:
    DEC_LAYERS: 2
  HIDDEN_DIM: 256
TRAIN:
  EM: true
  T_S_T: true
  BATCH_SIZE: 16
  EPOCH: 200
  LR: 0.0001
  NUM_WORKER: 8
  OPTIMIZER: ADAMW
  PRINT_INTERVAL: 50
  SCHEDULER:
    TYPE: step
    DECAY_RATE: 0.1
  WEIGHT_DECAY: 0.0001
TEST:
  EPOCH: 200
  SEARCH_FACTOR: 4.0
  SEARCH_SIZE: 256
  TEMPLATE_FACTOR: 4.0
  TEMPLATE_SIZE: 256
  NUM_TEMPLATES: 1
